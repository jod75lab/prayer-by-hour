<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f7f3" />
    <meta name="description" content="A quiet prayer intention for each hour of the day." />
    <title>Prayer by Hour</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f7f7f3;
        --surface: #fff;
        --ink: #202a25;
        --muted: #727b74;
        --line: #e4e8e1;
        --accent: #315b46;
        --accent-dark: #234633;
        --accent-soft: #edf3ec;
        --accent-line: #d9e4d8;
        --gold: #b18c52;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-width: 320px;
        background: var(--paper);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }

      .page {
        width: min(100% - 40px, 760px);
        margin: 0 auto;
        padding: 32px 0 58px;
      }

      .masthead {
        display: flex;
        align-items: center;
        gap: 11px;
        padding-bottom: 25px;
        border-bottom: 1px solid var(--line);
      }

      .mark {
        display: grid;
        width: 29px;
        height: 29px;
        place-items: center;
        border: 1px solid #cbd7cb;
        border-radius: 50%;
        color: var(--accent);
        font: 18px/1 Georgia, "Times New Roman", serif;
      }

      .wordmark {
        color: var(--accent-dark);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .16em;
      }

      .masthead a {
        margin-left: auto;
        color: var(--accent-dark);
        font-size: 13px;
        text-decoration: none;
      }

      .masthead a:hover { text-decoration: underline; text-underline-offset: 3px; }
      .masthead a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

      main { padding-top: 40px; }

      .season-line {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 9px;
        margin: 0;
        color: var(--accent);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: .12em;
        text-transform: uppercase;
      }

      .season-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 14px;
        margin-bottom: 13px;
      }

      .season-dot { color: #a8b1a8; }

      .hemisphere-control {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
      }

      .hemisphere-control select {
        max-width: 130px;
        padding: 5px 22px 5px 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--ink);
        background: #fff;
        font: inherit;
        cursor: pointer;
      }

      .hemisphere-control select:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      h1 {
        margin: 0 0 8px;
        font: 400 clamp(34px, 6vw, 46px)/1.08 Georgia, "Times New Roman", serif;
        letter-spacing: -.035em;
      }

      .date-line {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }

      .day-context {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin: 0 0 27px;
      }

      .solar-panel {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 8px 12px;
      }

      .sun-times {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }

      .solar-button {
        padding: 6px 9px;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--accent-dark);
        background: #fff;
        font: inherit;
        font-size: 11px;
        cursor: pointer;
      }

      .solar-button:hover { border-color: var(--accent); }

      .solar-button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .now-card {
        position: relative;
        display: grid;
        grid-template-columns: 76px 1fr;
        align-items: center;
        gap: 20px;
        min-height: 142px;
        padding: 23px 26px;
        overflow: hidden;
        border: 1px solid var(--accent-line);
        border-radius: 10px;
        background: var(--accent-soft);
      }

      .now-card::before {
        position: absolute;
        inset: 0 auto 0 0;
        width: 4px;
        background: var(--accent);
        content: "";
      }

      .hour-badge {
        display: grid;
        width: 66px;
        height: 66px;
        align-content: center;
        justify-items: center;
        border: 1px solid #c6d5c6;
        border-radius: 50%;
        color: var(--accent-dark);
        background: rgba(255,255,255,.6);
      }

      .hour-badge strong {
        font: 24px/1 Georgia, "Times New Roman", serif;
        letter-spacing: -.04em;
      }

      .hour-badge span {
        margin-top: 4px;
        color: var(--accent);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: .13em;
      }

      .now-label {
        margin: 0 0 8px;
        color: var(--accent);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: .13em;
        text-transform: uppercase;
      }

      .now-intention {
        max-width: 520px;
        margin: 0;
        font: 400 clamp(20px, 3vw, 25px)/1.32 Georgia, "Times New Roman", serif;
        letter-spacing: -.015em;
      }

      .list-heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        margin: 36px 0 12px;
      }

      h2 {
        margin: 0;
        font: 400 23px/1.2 Georgia, "Times New Roman", serif;
      }

      .local-time-note {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }

      .intentions {
        margin: 0;
        padding: 0;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--surface);
        list-style: none;
      }

      .intention-row {
        display: grid;
        grid-template-columns: 98px 1fr auto;
        align-items: center;
        gap: 16px;
        min-height: 59px;
        padding: 10px 18px;
        border-bottom: 1px solid #edf0eb;
      }

      .intention-row:last-child { border-bottom: 0; }

      .intention-row[aria-current="time"] {
        background: var(--accent-soft);
        box-shadow: inset 3px 0 var(--accent);
      }

      .hour-range {
        color: #69746c;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .office-anchor {
        display: block;
        margin-top: 3px;
        color: #98a099;
        font-size: 10px;
        line-height: 1.2;
      }

      .solar-marker {
        display: block;
        margin-top: 4px;
        color: var(--accent);
        font-size: 9px;
        font-weight: 700;
        line-height: 1.2;
        white-space: normal;
      }

      .intention-text {
        margin: 0;
        font-size: 14px;
        line-height: 1.45;
      }

      .now-tag {
        min-width: 34px;
        color: var(--accent);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: .12em;
        text-align: right;
      }

      .intention-row:not([aria-current="time"]) .now-tag { visibility: hidden; }

      .message {
        margin: 18px 0 0;
        color: #8b493d;
        font-size: 13px;
        line-height: 1.5;
      }

      [hidden] { display: none !important; }

      footer {
        padding-top: 17px;
        color: var(--muted);
        font-size: 11px;
        text-align: center;
      }

      footer p { margin: 0; }

      .site-credit {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin-top: 10px;
        padding: 5px 0;
        border-radius: 3px;
        color: var(--muted);
        text-decoration: none;
      }

      .site-credit img {
        display: block;
        width: 22px;
        height: 22px;
        object-fit: contain;
        opacity: .75;
      }

      .site-credit:hover,
      .site-credit:focus-visible {
        color: var(--accent-dark);
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .site-credit:hover img,
      .site-credit:focus-visible img { opacity: 1; }

      .site-credit:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
      }

      @media (max-width: 560px) {
        .page { width: min(100% - 28px, 760px); padding-top: 20px; }
        main { padding-top: 34px; }
        .season-header { align-items: flex-start; }
        .season-line { padding-top: 6px; }
        .day-context { align-items: flex-start; flex-direction: column; gap: 10px; }
        .solar-panel { justify-content: flex-start; }
        .now-card { grid-template-columns: 58px 1fr; gap: 14px; padding: 19px 16px; }
        .hour-badge { width: 54px; height: 54px; }
        .hour-badge strong { font-size: 21px; }
        .list-heading { align-items: flex-start; flex-direction: column; gap: 5px; margin-top: 30px; }
        .intention-row { grid-template-columns: 74px 1fr 30px; gap: 10px; padding: 10px 11px; }
        .hour-range { font-size: 11px; }
        .intention-text { font-size: 13px; }
      }

      @media (prefers-reduced-motion: no-preference) {
        .intention-row { transition: background-color 160ms ease; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="masthead" aria-label="Prayer by Hour">
        <span class="mark" aria-hidden="true">✝</span>
        <span class="wordmark">PRAYER BY HOUR</span>
        <a href="about.html">About</a>
      </header>

      <main>
        <div class="season-header">
          <div class="season-line" aria-label="Current seasons">
            <span id="calendar-season">Calendar season</span>
            <span class="season-dot" aria-hidden="true">·</span>
            <span id="liturgical-season">Liturgical season</span>
          </div>
          <label class="hemisphere-control" for="hemisphere-select">
            <span>Hemisphere</span>
            <select id="hemisphere-select" aria-label="Calendar season hemisphere">
              <option value="auto">Auto</option>
              <option value="north">Northern</option>
              <option value="south">Southern</option>
            </select>
          </label>
        </div>
        <h1>Prayer intentions</h1>
        <div class="day-context">
          <p class="date-line" id="today"></p>
          <div class="solar-panel">
            <p class="sun-times" id="sun-times" aria-live="polite">Add your location for local times.</p>
            <button class="solar-button" id="solar-button" type="button">Show my sunrise &amp; sunset</button>
          </div>
        </div>

        <section class="now-card" aria-label="Current prayer intention" aria-live="polite">
          <div class="hour-badge" aria-hidden="true">
            <strong id="hour-number">--</strong>
            <span>NOW</span>
          </div>
          <div>
            <p class="now-label">This hour · <span id="hour-range"></span></p>
            <p class="now-intention" id="now-intention">Loading today's intention…</p>
          </div>
        </section>

        <div class="list-heading">
          <h2>Today, hour by hour</h2>
          <p class="local-time-note">Your local time</p>
        </div>

        <ol class="intentions" id="intentions" aria-label="Prayer intentions by hour"></ol>
        <p class="message" id="message" role="status" hidden></p>
        <footer>
          <p>Pause for a moment of prayer.</p>
          <a class="site-credit" href="https://www.notiuhsibijiet.com/" target="_blank" rel="noopener noreferrer" aria-label="Visit notiuhsibijiet.com (opens in a new tab)">
            <img src="assets/noti-u-hsibijiet.png" alt="" width="22" height="22" loading="lazy" decoding="async" />
            <span>notiuhsibijiet.com</span>
          </a>
        </footer>
      </main>
    </div>

    <script>
      const DAY_MS = 24 * 60 * 60 * 1000;
      let intentionRows = [];
      let hemispherePreference = loadHemispherePreference();
      let solarCoordinates = null;
      const hemisphereSelect = document.getElementById("hemisphere-select");

      const pad = (value) => String(value).padStart(2, "0");
      const hourRange = (hour) => `${pad(hour)}:00–${pad((hour + 1) % 24)}:00`;
      const dayNumber = (date) => Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) / DAY_MS;
      const addDays = (date, days) => new Date(date.getFullYear(), date.getMonth(), date.getDate() + days);
      const isBetween = (date, start, end) => dayNumber(date) >= dayNumber(start) && dayNumber(date) <= dayNumber(end);

      function loadHemispherePreference() {
        try {
          const saved = window.localStorage.getItem("prayer-by-hour.hemisphere");
          return ["auto", "north", "south"].includes(saved) ? saved : "auto";
        } catch {
          return "auto";
        }
      }

      function detectHemisphere() {
        const zone = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
        const southernPrefixes = [
          "Australia/", "America/Argentina/", "Antarctica/",
          "Indian/Christmas", "Indian/Cocos", "Indian/Kerguelen", "Indian/Antananarivo",
          "Indian/Comoro", "Indian/Mauritius", "Indian/Reunion", "Indian/Mayotte", "Indian/Chagos",
          "Africa/Johannesburg", "Africa/Maputo", "Africa/Harare", "Africa/Windhoek",
          "Africa/Gaborone", "Africa/Lusaka", "Africa/Blantyre", "Africa/Maseru",
          "Africa/Mbabane", "Africa/Lubumbashi", "Africa/Luanda",
          "America/Santiago", "America/Punta_Arenas", "America/Montevideo", "America/Asuncion",
          "America/Sao_Paulo", "America/Maceio", "America/Recife", "America/Bahia",
          "America/Fortaleza", "America/Araguaina", "America/Campo_Grande", "America/Cuiaba",
          "America/Porto_Velho", "America/Manaus", "America/Boa_Vista", "America/Eirunepe",
          "America/Rio_Branco", "America/La_Paz", "America/Lima", "America/Guayaquil",
          "Atlantic/South_Georgia", "Pacific/Auckland", "Pacific/Chatham", "Pacific/Fiji",
          "Pacific/Apia", "Pacific/Tongatapu", "Pacific/Norfolk", "Pacific/Efate",
          "Pacific/Guadalcanal", "Pacific/Port_Moresby", "Pacific/Noumea", "Pacific/Pago_Pago",
          "Pacific/Rarotonga", "Pacific/Marquesas", "Pacific/Tahiti", "Pacific/Easter",
        ];
        return southernPrefixes.some((prefix) => prefix.endsWith("/") ? zone.startsWith(prefix) : zone === prefix)
          ? "south"
          : "north";
      }

      function getHemisphere() {
        return hemispherePreference === "auto" ? detectHemisphere() : hemispherePreference;
      }

      function parseCsv(text) {
        const rows = [];
        let row = [];
        let field = "";
        let quoted = false;
        const input = text.replace(/^\uFEFF/, "");

        for (let i = 0; i < input.length; i += 1) {
          const char = input[i];
          if (quoted) {
            if (char === '"' && input[i + 1] === '"') {
              field += '"';
              i += 1;
            } else if (char === '"') {
              quoted = false;
            } else {
              field += char;
            }
          } else if (char === '"' && field === "") {
            quoted = true;
          } else if (char === ",") {
            row.push(field);
            field = "";
          } else if (char === "\n" || char === "\r") {
            if (char === "\r" && input[i + 1] === "\n") i += 1;
            row.push(field);
            if (row.some((value) => value !== "")) rows.push(row);
            row = [];
            field = "";
          } else {
            field += char;
          }
        }
        if (field !== "" || row.length > 0) {
          row.push(field);
          if (row.some((value) => value !== "")) rows.push(row);
        }

        if (rows.length < 2) return [];
        const headers = rows[0].map((value) => value.trim());
        return rows.slice(1).map((values) => Object.fromEntries(headers.map((header, index) => [header, values[index] ?? ""])));
      }

      function getCalendarSeason(date) {
        const month = date.getMonth();
        let northernSeason;
        if (month >= 2 && month <= 4) northernSeason = "Spring";
        else if (month >= 5 && month <= 7) northernSeason = "Summer";
        else if (month >= 8 && month <= 10) northernSeason = "Autumn";
        else northernSeason = "Winter";
        if (getHemisphere() === "north") return northernSeason;
        return { Spring: "Autumn", Summer: "Winter", Autumn: "Spring", Winter: "Summer" }[northernSeason];
      }

      function easterSunday(year) {
        const a = year % 19;
        const b = Math.floor(year / 100);
        const c = year % 100;
        const d = Math.floor(b / 4);
        const e = b % 4;
        const f = Math.floor((b + 8) / 25);
        const g = Math.floor((b - f + 1) / 3);
        const h = (19 * a + b - d - g + 15) % 30;
        const i = Math.floor(c / 4);
        const k = c % 4;
        const l = (32 + 2 * e + 2 * i - h - k) % 7;
        const m = Math.floor((a + 11 * h + 22 * l) / 451);
        const month = Math.floor((h + l - 7 * m + 114) / 31);
        const day = ((h + l - 7 * m + 114) % 31) + 1;
        return new Date(year, month - 1, day);
      }

      function firstAdventSunday(year) {
        const decemberThird = new Date(year, 11, 3);
        return addDays(decemberThird, -decemberThird.getDay());
      }

      function baptismOfTheLord(year) {
        const epiphany = new Date(year, 0, 6);
        const daysUntilSunday = (7 - epiphany.getDay()) % 7 || 7;
        return addDays(epiphany, daysUntilSunday);
      }

      function getLiturgicalSeason(date) {
        const year = date.getFullYear();
        const easter = easterSunday(year);
        const ashWednesday = addDays(easter, -46);
        const palmSunday = addDays(easter, -7);
        const pentecost = addDays(easter, 49);

        if (isBetween(date, palmSunday, addDays(easter, -1))) return "Holy Week";
        if (isBetween(date, ashWednesday, addDays(palmSunday, -1))) return "Lent";
        if (isBetween(date, easter, pentecost)) return "Easter";

        const advent = firstAdventSunday(year);
        if (isBetween(date, advent, new Date(year, 11, 24))) return "Advent";

        for (const christmasYear of [year - 1, year]) {
          const christmas = new Date(christmasYear, 11, 25);
          const baptism = baptismOfTheLord(christmasYear + 1);
          if (isBetween(date, christmas, baptism)) return "Christmas";
        }

        return "Ordinary Time";
      }

      function getSunTimes(date, coordinates) {
        const year = date.getFullYear();
        const dayOfYear = Math.floor((Date.UTC(year, date.getMonth(), date.getDate()) - Date.UTC(year, 0, 0)) / DAY_MS);
        const daysInYear = new Date(year, 1, 29).getMonth() === 1 ? 366 : 365;
        const gamma = 2 * Math.PI / daysInYear * (dayOfYear - 1);
        const equationOfTime = 229.18 * (
          0.000075 + 0.001868 * Math.cos(gamma) - 0.032077 * Math.sin(gamma)
          - 0.014615 * Math.cos(2 * gamma) - 0.040849 * Math.sin(2 * gamma)
        );
        const declination = 0.006918 - 0.399912 * Math.cos(gamma) + 0.070257 * Math.sin(gamma)
          - 0.006758 * Math.cos(2 * gamma) + 0.000907 * Math.sin(2 * gamma)
          - 0.002697 * Math.cos(3 * gamma) + 0.00148 * Math.sin(3 * gamma);
        const latitude = coordinates.latitude * Math.PI / 180;
        const cosHourAngle = (Math.cos(90.833 * Math.PI / 180) / (Math.cos(latitude) * Math.cos(declination)))
          - Math.tan(latitude) * Math.tan(declination);

        if (cosHourAngle > 1) return { sunrise: null, sunset: null, polarState: "night" };
        if (cosHourAngle < -1) return { sunrise: null, sunset: null, polarState: "day" };

        const hourAngle = Math.acos(cosHourAngle) * 180 / Math.PI;
        const utcMidnight = Date.UTC(year, date.getMonth(), date.getDate());
        const sunriseMinutes = 720 - 4 * (coordinates.longitude + hourAngle) - equationOfTime;
        const sunsetMinutes = 720 - 4 * (coordinates.longitude - hourAngle) - equationOfTime;
        return {
          sunrise: new Date(utcMidnight + sunriseMinutes * 60_000),
          sunset: new Date(utcMidnight + sunsetMinutes * 60_000),
        };
      }

      function getSolarEventsForHour(sunTimes, hour) {
        if (!sunTimes) return [];
        return [
          { name: "Sunrise", time: sunTimes.sunrise },
          { name: "Sunset", time: sunTimes.sunset },
        ].filter((event) => event.time && event.time.getHours() === hour);
      }

      function formatLocalTime(date) {
        return new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit" }).format(date);
      }

      function addSolarPrayer(intention, events, calendarSeason) {
        if (events.length === 0) return intention;
        const reflections = {
          Spring: {
            Sunrise: "As spring light touches new leaves, renew our hope.",
            Sunset: "As spring dusk settles over the fields, grant rest to all who are weary.",
          },
          Summer: {
            Sunrise: "As summer dawn opens a long day, guide our work toward the good.",
            Sunset: "As the long summer light fades, gather the day's labor into gratitude.",
          },
          Autumn: {
            Sunrise: "As autumn light finds the turning leaves, teach us to welcome change.",
            Sunset: "As autumn evening cools the earth, shelter all who seek a place to rest.",
          },
          Winter: {
            Sunrise: "As winter dawn arrives slowly, give courage to those who wait in darkness.",
            Sunset: "As winter twilight lengthens, stay near to all who face a long night.",
          },
        };
        return `${intention} ${events.map((event) => reflections[calendarSeason][event.name]).join(" ")}`;
      }

      function requestSolarTimes() {
        const times = document.getElementById("sun-times");
        const button = document.getElementById("solar-button");
        if (!navigator.geolocation) {
          times.textContent = "Location-based sunrise and sunset are not available in this browser.";
          return;
        }
        times.textContent = "Finding today's local sunrise and sunset…";
        button.disabled = true;
        navigator.geolocation.getCurrentPosition((position) => {
          solarCoordinates = {
            latitude: position.coords.latitude,
            longitude: position.coords.longitude,
          };
          button.disabled = false;
          button.textContent = "Update location";
          render();
        }, () => {
          times.textContent = "Location wasn't available. You can try again when ready.";
          button.disabled = false;
        }, { enableHighAccuracy: false, maximumAge: 3_600_000, timeout: 15_000 });
      }

      function makeRow(hour, calendarSeason, liturgicalSeason) {
        return intentionRows.find((entry) => Number(entry.hour) === hour
          && entry.calendar_season === calendarSeason
          && entry.liturgical_season === liturgicalSeason);
      }

      function setAccent(liturgicalSeason) {
        const colors = {
          Advent: ["#684c70", "#513a57", "#f2eef4", "#e2d8e7"],
          Christmas: ["#9a7440", "#74572f", "#f6f1e6", "#eadfc8"],
          "Ordinary Time": ["#315b46", "#234633", "#edf3ec", "#d9e4d8"],
          Lent: ["#684c70", "#513a57", "#f2eef4", "#e2d8e7"],
          "Holy Week": ["#784b48", "#5a3634", "#f4eeed", "#e7d9d7"],
          Easter: ["#9a7440", "#74572f", "#f6f1e6", "#eadfc8"],
        };
        const [accent, dark, soft, border] = colors[liturgicalSeason] || colors["Ordinary Time"];
        document.documentElement.style.setProperty("--accent", accent);
        document.documentElement.style.setProperty("--accent-dark", dark);
        document.documentElement.style.setProperty("--accent-soft", soft);
        document.documentElement.style.setProperty("--accent-line", border);
      }

      function render() {
        const now = new Date();
        const intentionField = now.getDay() === 0 ? "sunday_intention" : "intention";
        const hour = now.getHours();
        const calendarSeason = getCalendarSeason(now);
        const liturgicalSeason = getLiturgicalSeason(now);
        const sunTimes = solarCoordinates ? getSunTimes(now, solarCoordinates) : null;

        document.getElementById("today").textContent = new Intl.DateTimeFormat(undefined, {
          weekday: "long", day: "numeric", month: "long", year: "numeric",
        }).format(now);
        const sunTimesLabel = document.getElementById("sun-times");
        if (sunTimes) {
          sunTimesLabel.textContent = sunTimes.sunrise && sunTimes.sunset
            ? `Sunrise ${formatLocalTime(sunTimes.sunrise)} · Sunset ${formatLocalTime(sunTimes.sunset)}`
            : sunTimes.polarState === "day"
              ? "The sun stays above the horizon here today."
              : "The sun stays below the horizon here today.";
        }
        document.getElementById("calendar-season").textContent = calendarSeason;
        document.getElementById("liturgical-season").textContent = liturgicalSeason;
        hemisphereSelect.value = hemispherePreference;
        hemisphereSelect.options[0].textContent = `Auto (${getHemisphere() === "north" ? "North" : "South"})`;
        document.getElementById("hour-number").textContent = pad(hour);
        const currentSolarEvents = getSolarEventsForHour(sunTimes, hour);
        const solarLabel = currentSolarEvents.map((event) => `${event.name} ${formatLocalTime(event.time)}`).join(" · ");
        document.getElementById("hour-range").textContent = solarLabel ? `${hourRange(hour)} · ${solarLabel}` : hourRange(hour);
        setAccent(liturgicalSeason);

        const active = makeRow(hour, calendarSeason, liturgicalSeason);
        document.getElementById("now-intention").textContent = active?.[intentionField]
          ? addSolarPrayer(active[intentionField], currentSolarEvents, calendarSeason)
          : "No intention is set for this hour and season.";

        const list = document.getElementById("intentions");
        list.replaceChildren();
        for (let index = 0; index < 24; index += 1) {
          const entry = makeRow(index, calendarSeason, liturgicalSeason);
          const item = document.createElement("li");
          item.className = "intention-row";
          if (index === hour) item.setAttribute("aria-current", "time");

          const time = document.createElement("span");
          time.className = "hour-range";
          time.append(document.createTextNode(hourRange(index)));
          const anchor = document.createElement("span");
          anchor.className = "office-anchor";
          anchor.textContent = entry?.psalter_anchor || "";
          time.append(anchor);
          const rowSolarEvents = getSolarEventsForHour(sunTimes, index);
          if (rowSolarEvents.length > 0) {
            const marker = document.createElement("span");
            marker.className = "solar-marker";
            marker.textContent = rowSolarEvents.map((event) => `${event.name} · ${formatLocalTime(event.time)}`).join(" · ");
            time.append(marker);
          }

          const intention = document.createElement("p");
          intention.className = "intention-text";
          intention.textContent = entry?.[intentionField]
            ? addSolarPrayer(entry[intentionField], rowSolarEvents, calendarSeason)
            : "No intention set.";

          const nowTag = document.createElement("span");
          nowTag.className = "now-tag";
          nowTag.textContent = "NOW";
          nowTag.setAttribute("aria-hidden", "true");

          item.append(time, intention, nowTag);
          list.append(item);
        }

        const missingHours = Array.from({ length: 24 }, (_, index) => index)
          .filter((index) => !makeRow(index, calendarSeason, liturgicalSeason)?.[intentionField]);
        const message = document.getElementById("message");
        message.textContent = missingHours.length > 0
          ? `${missingHours.length} hourly intention${missingHours.length === 1 ? " is" : "s are"} missing for ${calendarSeason} / ${liturgicalSeason}. Update data/intentions.csv.`
          : "";
        message.hidden = missingHours.length === 0;
      }

      async function start() {
        const message = document.getElementById("message");
        try {
          const dataUrl = new URL("./data/intentions.csv", window.location.href);
          const response = await fetch(dataUrl, { cache: "no-cache" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          intentionRows = parseCsv(await response.text());
          if (intentionRows.length === 0) throw new Error("No intention records were found.");
          render();
          window.setInterval(render, 30_000);
        } catch (error) {
          document.getElementById("now-intention").textContent = "Today's intentions could not be loaded.";
          message.textContent = "The intention file could not be read. Open the site through GitHub Pages or a local web server.";
          message.hidden = false;
        }
      }

      hemisphereSelect.value = hemispherePreference;
      hemisphereSelect.addEventListener("change", () => {
        hemispherePreference = hemisphereSelect.value;
        try {
          window.localStorage.setItem("prayer-by-hour.hemisphere", hemispherePreference);
        } catch {
          // The selection still applies for this page view if browser storage is unavailable.
        }
        render();
      });

      document.getElementById("solar-button").addEventListener("click", requestSolarTimes);

      start();
    </script>
  </body>
</html>
